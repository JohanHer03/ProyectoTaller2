<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Crear cuenta')}"></head>

  <body>
    <main class="acceso">
      <div class="acceso-caja">
        <a class="marca" th:href="@{/login/}">
          <span class="marca-tecla" aria-hidden="true">LP</span>
          LuiPaoxYin
        </a>

        <div class="hoja">
          <h1>Crea tu cuenta</h1>
          <p class="acceso-nota">
            Un administrador revisará tu registro y activará la cuenta.
          </p>

          <div th:replace="~{fragmentos :: avisos}"></div>

          <form th:action="@{/login/registrar}" method="post" class="formulario">
            <div class="campo">
              <label for="email">Correo</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="correo@ejemplo.com"
              />
            </div>

            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="new-password"
              />
            </div>

            <button type="submit" class="tecla tecla-enter tecla-ancha">
              Crear cuenta <span class="leyenda" aria-hidden="true">↵</span>
            </button>
          </form>
        </div>

        <p class="acceso-alterno">
          ¿Ya tienes cuenta?
          <a th:href="@{/login/}">Inicia sesión</a>
        </p>
      </div>
    </main>
  </body>
</html>
