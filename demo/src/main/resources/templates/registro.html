<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <div class="min-h-screen flex items-center justify-center px-6 py-10">
      <div class="w-full max-w-md">
        <!-- ========================= -->
        <!-- TARJETA -->
        <!-- ========================= -->

        <div class="bg-white rounded-2xl shadow-xl p-8">
          <!-- ========================= -->
          <!-- ENCABEZADO -->
          <!-- ========================= -->

          <div class="text-center mb-8">
            <p class="text-sm font-medium text-blue-600 mb-2">Registro</p>

            <h1 class="text-3xl font-bold text-slate-800">Crear cuenta</h1>

            <p class="text-slate-500 mt-2">Crea tu acceso a la plataforma.</p>
          </div>

          <!-- ========================= -->
          <!-- ERROR -->
          <!-- ========================= -->

          <div
            th:if="${error}"
            class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"
          >
            <p th:text="${error}"></p>
          </div>

          <!-- ========================= -->
          <!-- FORMULARIO -->
          <!-- ========================= -->

          <form th:action="@{/login/registrar}" method="post" class="space-y-5">
            <!-- CORREO -->

            <div>
              <label
                for="email"
                class="block text-sm font-semibold text-slate-700 mb-2"
              >
                Correo
              </label>

              <input
                type="email"
                id="email"
                name="email"
                required
                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                placeholder="correo@ejemplo.com"
              />
            </div>

            <!-- CONTRASEÑA -->

            <div>
              <label
                for="password"
                class="block text-sm font-semibold text-slate-700 mb-2"
              >
                Contraseña
              </label>

              <input
                type="password"
                id="password"
                name="password"
                required
                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                placeholder="Ingresa una contraseña"
              />
            </div>

            <!-- BOTÓN -->

            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
            >
              Registrarse
            </button>
          </form>

          <!-- ========================= -->
          <!-- VOLVER -->
          <!-- ========================= -->

          <div class="border-t border-slate-200 mt-6 pt-6 text-center">
            <a
              th:href="@{/login/}"
              class="text-sm font-semibold text-blue-600 transition hover:text-blue-700"
            >
              ← Volver al login
            </a>
          </div>
        </div>

        <!-- ========================= -->
        <!-- PIE -->
        <!-- ========================= -->

        <p class="text-center text-xs text-slate-400 mt-6">
          Plataforma de gestión
        </p>
      </div>
    </div>
  </body>
</html>
