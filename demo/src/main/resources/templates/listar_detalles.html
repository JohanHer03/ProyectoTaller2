<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Detalle de compra')}"></head>

  <body>
    <header
      th:replace="~{fragmentos :: barra(${admin} ? 'compras' : 'mis-compras')}"
    ></header>

    <main class="pagina">
      <div th:replace="~{fragmentos :: avisos}"></div>

      <div class="cabecera">
        <div>
          <h1 th:text="'Compra N.º ' + ${encabezado.id}">Compra</h1>
          <p
            th:text="${encabezado.cliente.nombre} + ' ' + ${encabezado.cliente.apellido} + ', ' + ${#dates.format(encabezado.fecha, 'dd/MM/yyyy')}"
          ></p>
        </div>

        <div class="acciones no-imprimir">
          <a
            class="tecla"
            th:if="${admin}"
            th:href="@{/encabezado/}"
            >Volver a compras</a
          >
          <a
            class="tecla"
            th:unless="${admin}"
            th:href="@{/encabezado/mis-compras}"
            >Volver a mis compras</a
          >
          <a
            class="tecla tecla-enter"
            th:href="@{/encabezado/factura/{id}/pdf(id=${encabezado.id})}"
            >Descargar factura PDF</a
          >
        </div>
      </div>

      <div class="hoja hoja-tabla">
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="num">Precio</th>
                <th class="num">Cantidad</th>
                <th class="num">Valor</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="detalle : ${detalles}">
                <td>
                  <span class="fuerte" th:text="${detalle.producto.nombre}"></span>
                  <p
                    class="descripcion"
                    th:text="${detalle.producto.descripcion}"
                  ></p>
                </td>
                <td
                  class="num"
                  th:text="'$' + ${#numbers.formatDecimal(detalle.producto.precio, 0, 'POINT', 0, 'COMMA')}"
                ></td>
                <td class="num" th:text="${detalle.cantidad}"></td>
                <td
                  class="num fuerte"
                  th:text="'$' + ${#numbers.formatDecimal(detalle.valor, 0, 'POINT', 0, 'COMMA')}"
                ></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="tabla-pie">
          <span class="tenue">Total de la compra</span>
          <span
            class="caja-total-cifra"
            th:text="'$' + ${#numbers.formatDecimal(encabezado.total, 0, 'POINT', 0, 'COMMA')}"
          ></span>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
