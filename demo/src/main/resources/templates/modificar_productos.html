<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head(${titulo} ?: 'Producto')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('productos')}"></header>

    <main class="pagina pagina-angosta">
      <div class="cabecera">
        <div>
          <h1 th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">
            Producto
          </h1>
          <p>Los cambios se reflejan de inmediato en la tienda.</p>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <div class="hoja">
        <form
          th:action="@{/producto/guardar}"
          method="post"
          th:object="${producto}"
          class="formulario"
        >
          <input type="hidden" th:field="*{id}" />

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
          </div>

          <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea
              id="descripcion"
              th:field="*{descripcion}"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="fila-campos">
            <div class="campo">
              <label for="precio">Precio (COP)</label>
              <input
                type="number"
                id="precio"
                th:field="*{precio}"
                min="0"
                required
              />
            </div>

            <div class="campo">
              <label for="stock">Stock</label>
              <input
                type="number"
                id="stock"
                th:field="*{stock}"
                min="0"
                required
              />
            </div>
          </div>

          <div class="acciones">
            <button type="submit" class="tecla tecla-enter">
              Guardar producto <span class="leyenda" aria-hidden="true">↵</span>
            </button>
            <a class="tecla" th:href="@{/producto/listar}">Cancelar</a>
          </div>
        </form>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
