<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${titulo}">Producto</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <div class="max-w-3xl mx-auto px-6 py-10">
      <!-- ENCABEZADO -->

      <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
        <p class="text-sm font-medium text-blue-600 mb-1">
          Gestión de productos
        </p>

        <h1 th:text="${titulo}" class="text-3xl font-bold text-slate-800"></h1>

        <p class="text-slate-500 mt-2">
          Registra o modifica la información del producto.
        </p>
      </div>

      <!-- FORMULARIO -->

      <div class="bg-white rounded-2xl shadow-xl p-8">
        <!-- VOLVER -->

        <div class="mb-6">
          <a
            th:href="@{/producto/}"
            class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-blue-600"
          >
            ← Volver a productos
          </a>
        </div>

        <form
          th:action="@{/producto/guardar}"
          method="post"
          th:object="${producto}"
          class="space-y-5"
        >
          <!-- ID -->

          <input type="hidden" th:field="*{id}" />

          <!-- NOMBRE -->

          <div>
            <label
              for="nombre"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Nombre
            </label>

            <input
              type="text"
              id="nombre"
              th:field="*{nombre}"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- DESCRIPCIÓN -->

          <div>
            <label
              for="descripcion"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Descripción
            </label>

            <textarea
              id="descripcion"
              th:field="*{descripcion}"
              rows="4"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none resize-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            ></textarea>
          </div>

          <!-- PRECIO -->

          <div>
            <label
              for="precio"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Precio
            </label>

            <input
              type="number"
              id="precio"
              th:field="*{precio}"
              min="0"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- STOCK -->

          <div>
            <label
              for="stock"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Stock
            </label>

            <input
              type="number"
              id="stock"
              th:field="*{stock}"
              min="0"
              required
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- GUARDAR -->

          <div class="pt-3">
            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition duration-200 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 active:scale-[0.99]"
            >
              Guardar producto
            </button>
          </div>
        </form>
      </div>

      <!-- PIE -->

      <div class="text-center mt-8">
        <p class="text-xs text-slate-400">Administración de productos</p>
      </div>
    </div>
  </body>
</html>
