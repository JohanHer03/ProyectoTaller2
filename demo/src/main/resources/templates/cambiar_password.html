<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Cambiar contraseña')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('')}"></header>

    <main class="pagina pagina-angosta">
      <div class="cabecera">
        <div>
          <h1>Cambiar contraseña</h1>
          <p>Escribe tu contraseña actual y luego la nueva dos veces.</p>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <div class="hoja">
        <form
          th:action="${adminPassword} ? @{/admin/cambiar-password} : @{/cliente/cambiar-password}"
          method="post"
          class="formulario"
        >
          <div class="campo">
            <label for="passwordActual">Contraseña actual</label>
            <input
              type="password"
              id="passwordActual"
              name="passwordActual"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="campo">
            <label for="nuevaPassword">Nueva contraseña</label>
            <input
              type="password"
              id="nuevaPassword"
              name="nuevaPassword"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="campo">
            <label for="confirmarPassword">Repite la nueva contraseña</label>
            <input
              type="password"
              id="confirmarPassword"
              name="confirmarPassword"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="acciones">
            <button type="submit" class="tecla tecla-enter">
              Cambiar contraseña <span class="leyenda" aria-hidden="true">↵</span>
            </button>
            <a
              class="tecla"
              th:href="${adminPassword} ? @{/admin/perfil} : @{/cliente/perfil}"
              >Cancelar</a
            >
          </div>
        </form>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
