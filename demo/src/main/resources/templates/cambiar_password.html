<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${titulo}">Cambiar contraseña</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <div class="max-w-xl mx-auto px-6 py-10">
      <!-- ========================= -->
      <!-- ENCABEZADO -->
      <!-- ========================= -->

      <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
        <p class="text-sm font-medium text-blue-600 mb-1">
          Seguridad de la cuenta
        </p>

        <h1 th:text="${titulo}" class="text-3xl font-bold text-slate-800">
          Cambiar contraseña
        </h1>

        <p class="text-slate-500 mt-2">
          Actualiza la contraseña de acceso a tu cuenta.
        </p>
      </div>

      <!-- ========================= -->
      <!-- FORMULARIO -->
      <!-- ========================= -->

      <div class="bg-white rounded-2xl shadow-xl p-8">
        <!-- ERROR -->

        <div
          th:if="${error}"
          class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"
        >
          <p th:text="${error}"></p>
        </div>

        <form
          th:action="${adminPassword} ? @{/admin/cambiar-password} : @{/cliente/cambiar-password}"
          method="post"
          class="space-y-6"
        >
          <!-- CONTRASEÑA ACTUAL -->

          <div>
            <label
              for="passwordActual"
              class="block text-sm font-semibold text-slate-700 mb-2"
            >
              Contraseña actual
            </label>

            <input
              type="password"
              id="passwordActual"
              name="passwordActual"
              required
              class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- NUEVA CONTRASEÑA -->

          <div>
            <label
              for="nuevaPassword"
              class="block text-sm font-semibold text-slate-700 mb-2"
            >
              Nueva contraseña
            </label>

            <input
              type="password"
              id="nuevaPassword"
              name="nuevaPassword"
              required
              class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- CONFIRMAR CONTRASEÑA -->

          <div>
            <label
              for="confirmarPassword"
              class="block text-sm font-semibold text-slate-700 mb-2"
            >
              Confirmar nueva contraseña
            </label>

            <input
              type="password"
              id="confirmarPassword"
              name="confirmarPassword"
              required
              class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- ========================= -->
          <!-- BOTÓN -->
          <!-- ========================= -->

          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
          >
            Cambiar contraseña
          </button>
        </form>

        <!-- ========================= -->
        <!-- VOLVER -->
        <!-- ========================= -->

        <div class="mt-6 pt-6 border-t border-slate-200">
          <a
            th:href="${adminPassword} ? @{/admin/perfil} : @{/cliente/perfil}"
            class="inline-flex items-center text-sm font-semibold text-slate-600 transition hover:text-blue-600"
          >
            ← Volver a mi perfil
          </a>
        </div>
      </div>

      <!-- PIE -->

      <div class="text-center mt-8">
        <p class="text-xs text-slate-400">Seguridad de la cuenta</p>
      </div>
    </div>
  </body>
</html>
