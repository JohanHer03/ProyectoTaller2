<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Tienda')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('tienda')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Productos disponibles</h1>
          <p>Elige la cantidad de cada producto y confirma tu compra.</p>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <form th:action="@{/encabezado/comprar}" method="post" id="form-compra">
        <div class="hoja hoja-tabla">
          <ul class="productos">
            <li
              class="producto"
              th:each="producto : ${productos}"
              th:if="${producto.stock > 0}"
              th:data-precio="${producto.precio}"
            >
              <div class="producto-info">
                <h3 th:text="${producto.nombre}">Producto</h3>
                <p class="descripcion" th:text="${producto.descripcion}"></p>
              </div>

              <div class="producto-precio">
                <strong
                  th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}"
                  >$0</strong
                >
                <span th:text="${producto.stock} + ' en stock'"></span>
              </div>

              <div class="cantidad">
                <button
                  type="button"
                  class="tecla"
                  data-paso="-1"
                  th:aria-label="'Quitar una unidad de ' + ${producto.nombre}"
                >
                  −
                </button>
                <input
                  type="number"
                  min="0"
                  th:max="${producto.stock}"
                  th:name="'cantidad_' + ${producto.id}"
                  th:aria-label="'Cantidad de ' + ${producto.nombre}"
                  value="0"
                  inputmode="numeric"
                />
                <button
                  type="button"
                  class="tecla"
                  data-paso="1"
                  th:aria-label="'Agregar una unidad de ' + ${producto.nombre}"
                >
                  +
                </button>
              </div>
            </li>
          </ul>

          <div
            class="vacio"
            th:if="${#lists.isEmpty(productos.?[stock > 0])}"
          >
            <h2>No hay productos con stock</h2>
            <p>Vuelve más tarde; el inventario se actualiza con frecuencia.</p>
          </div>

          <div class="caja-total">
            <div>
              <p class="caja-total-etiqueta" id="resumen">
                Aún no has elegido productos
              </p>
              <p class="caja-total-cifra" id="total">$0</p>
            </div>

            <div class="acciones">
              <a class="tecla" th:href="@{/cliente/}">Cancelar</a>
              <button type="submit" class="tecla tecla-enter">
                Confirmar compra <span class="leyenda" aria-hidden="true">↵</span>
              </button>
            </div>
          </div>
        </div>
      </form>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>

    <script th:src="@{/js/compra.js}"></script>
  </body>
</html>
