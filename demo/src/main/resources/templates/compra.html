<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Realizar compra</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100">
    <div class="max-w-7xl mx-auto px-6 py-10">
      <!-- ========================= -->
      <!-- ENCABEZADO -->
      <!-- ========================= -->

      <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
        >
          <div>
            <p class="text-sm font-medium text-blue-600 mb-1">Tienda</p>

            <h1 class="text-3xl font-bold text-slate-800">
              Productos disponibles
            </h1>

            <p class="text-slate-500 mt-2">
              Selecciona los productos y las cantidades que deseas comprar.
            </p>
          </div>

          <a
            th:href="@{/cliente/}"
            class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-blue-600"
          >
            ← Volver al menú
          </a>
        </div>
      </div>

      <!-- ========================= -->
      <!-- MENSAJE DE ERROR -->
      <!-- ========================= -->

      <div
        th:if="${error}"
        class="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"
      >
        <p th:text="${error}"></p>
      </div>

      <!-- ========================= -->
      <!-- FORMULARIO -->
      <!-- ========================= -->

      <form th:action="@{/encabezado/comprar}" method="post">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
          <!-- ========================= -->
          <!-- TABLA -->
          <!-- ========================= -->

          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <!-- ENCABEZADO -->

              <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                  <th
                    class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500"
                  >
                    Producto
                  </th>

                  <th
                    class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500"
                  >
                    Descripción
                  </th>

                  <th
                    class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500"
                  >
                    Precio
                  </th>

                  <th
                    class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500"
                  >
                    Stock
                  </th>

                  <th
                    class="px-6 py-4 text-xs font-semibold uppercase tracking-wider text-slate-500"
                  >
                    Cantidad
                  </th>
                </tr>
              </thead>

              <!-- ========================= -->
              <!-- PRODUCTOS -->
              <!-- ========================= -->

              <tbody class="divide-y divide-slate-100">
                <tr
                  th:each="producto : ${productos}"
                  th:if="${producto.stock > 0}"
                  class="transition hover:bg-slate-50"
                >
                  <!-- PRODUCTO -->

                  <td
                    th:text="${producto.nombre}"
                    class="px-6 py-5 text-sm font-semibold text-slate-800"
                  ></td>

                  <!-- DESCRIPCIÓN -->

                  <td
                    th:text="${producto.descripcion}"
                    class="px-6 py-5 text-sm text-slate-600 max-w-md"
                  ></td>

                  <!-- PRECIO -->

                  <td
                    th:text="'$'+${producto.precio}"
                    class="px-6 py-5 text-sm font-semibold text-slate-800"
                  ></td>

                  <!-- STOCK -->

                  <td class="px-6 py-5">
                    <span
                      th:text="${producto.stock}"
                      class="inline-flex items-center rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700"
                    >
                    </span>
                  </td>

                  <!-- CANTIDAD -->

                  <td class="px-6 py-5">
                    <input
                      type="number"
                      min="0"
                      th:max="${producto.stock}"
                      th:name="'cantidad_' + ${producto.id}"
                      value="0"
                      class="w-24 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- ========================= -->
          <!-- ACCIONES -->
          <!-- ========================= -->

          <div
            class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 border-t border-slate-200 bg-slate-50 px-6 py-5"
          >
            <a
              th:href="@{/cliente/}"
              class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50 hover:text-blue-600"
            >
              Cancelar
            </a>

            <button
              type="submit"
              class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
            >
              Confirmar compra
            </button>
          </div>
        </div>
      </form>

      <!-- ========================= -->
      <!-- PIE -->
      <!-- ========================= -->

      <div class="text-center mt-8">
        <p class="text-xs text-slate-400">
          Selecciona cantidades mayores a 0 para realizar tu compra.
        </p>
      </div>
    </div>
  </body>
</html>
