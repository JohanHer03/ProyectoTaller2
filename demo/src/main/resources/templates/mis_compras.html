<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head(${titulo} ?: 'Mis compras')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('mis-compras')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1 th:text="${titulo} ?: 'Mis compras'">Mis compras</h1>
          <p>Tu historial de compras. Abre una para ver el detalle o la factura.</p>
        </div>

        <div class="acciones">
          <a class="tecla tecla-enter" th:href="@{/encabezado/comprar}">
            Comprar productos
          </a>
        </div>
      </div>

      <div class="hoja vacio" th:if="${#lists.isEmpty(encabezados)}">
        <h2>Todavía no tienes compras</h2>
        <p>Cuando confirmes tu primera compra, aparecerá en esta lista.</p>
        <a class="tecla tecla-enter" th:href="@{/encabezado/comprar}">
          Ir a la tienda
        </a>
      </div>

      <div
        class="hoja hoja-tabla"
        th:if="${!#lists.isEmpty(encabezados)}"
      >
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Compra</th>
                <th>Fecha</th>
                <th class="num">Total</th>
                <th><span class="visualmente-oculto">Acciones</span></th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="encabezado : ${encabezados}">
                <td class="fuerte" th:text="'N.º ' + ${encabezado.id}"></td>
                <td
                  th:text="${#dates.format(encabezado.fecha, 'dd/MM/yyyy')}"
                ></td>
                <td
                  class="num fuerte"
                  th:text="'$' + ${#numbers.formatDecimal(encabezado.total, 0, 'POINT', 0, 'COMMA')}"
                ></td>
                <td>
                  <div class="acciones">
                    <a
                      class="tecla tecla-sm"
                      th:href="@{/encabezado/detalles/{id}(id=${encabezado.id})}"
                      >Ver detalle</a
                    >
                    <a
                      class="tecla tecla-sm"
                      th:href="@{/encabezado/factura/{id}/pdf(id=${encabezado.id})}"
                      >Factura PDF</a
                    >
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
