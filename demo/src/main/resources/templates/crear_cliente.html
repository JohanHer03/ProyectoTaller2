<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Crear usuario')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('usuarios')}"></header>

    <main class="pagina pagina-angosta">
      <div class="cabecera">
        <div>
          <h1>Crear usuario</h1>
          <p>
            La cuenta queda activa de inmediato. La persona completa sus datos
            personales al iniciar sesión.
          </p>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <div class="hoja">
        <form th:action="@{/admin/crear-cliente}" method="post" class="formulario">
          <div class="campo">
            <label for="email">Correo</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="off"
              placeholder="correo@ejemplo.com"
            />
          </div>

          <div class="campo">
            <label for="password">Contraseña inicial</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="new-password"
            />
            <p class="campo-ayuda">
              Compártela con la persona; podrá cambiarla desde su perfil.
            </p>
          </div>

          <div class="campo">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
              <option value="CLIENTE">Cliente</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>

          <div class="acciones">
            <button type="submit" class="tecla tecla-enter">
              Crear usuario <span class="leyenda" aria-hidden="true">↵</span>
            </button>
            <a class="tecla" th:href="@{/admin/usuarios}">Cancelar</a>
          </div>
        </form>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
