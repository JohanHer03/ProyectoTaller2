<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Productos')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('productos')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Productos</h1>
          <p>Administra el catálogo y el inventario de la tienda.</p>
        </div>
      </div>

      <nav class="teclado" aria-label="Opciones de productos">
        <a class="tecla-menu doble enter" th:href="@{/producto/agregar}">
          <h3>Crear producto</h3>
          <p>Agrega un producto nuevo al catálogo.</p>
        </a>

        <a class="tecla-menu doble" th:href="@{/producto/listar}">
          <h3>Ver inventario</h3>
          <p>Consulta precios y stock, edita o elimina productos.</p>
        </a>
      </nav>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
