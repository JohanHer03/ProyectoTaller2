<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Inventario')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('productos')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Inventario</h1>
          <p>Los productos del catálogo con su precio y stock actual.</p>
        </div>

        <div class="acciones">
          <a class="tecla tecla-enter" th:href="@{/producto/agregar}">
            Crear producto
          </a>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <div
        class="hoja hoja-tabla"
        th:if="${productos != null and !productos.empty}"
      >
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Producto</th>
                <th class="num">Precio</th>
                <th>Stock</th>
                <th><span class="visualmente-oculto">Acciones</span></th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="producto : ${productos}">
                <td>
                  <span class="fuerte" th:text="${producto.nombre}"></span>
                  <p class="descripcion" th:text="${producto.descripcion}"></p>
                </td>
                <td
                  class="num fuerte"
                  th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'POINT', 0, 'COMMA')}"
                ></td>
                <td>
                  <span
                    class="estado estado-alerta"
                    th:if="${producto.stock == 0}"
                    >Agotado</span
                  >
                  <span
                    class="estado estado-ok"
                    th:if="${producto.stock > 0}"
                    th:text="${producto.stock} + ' unidades'"
                  ></span>
                </td>
                <td>
                  <div class="acciones">
                    <a
                      class="tecla tecla-sm"
                      th:href="@{/producto/editar/} + ${producto.id}"
                      >Editar</a
                    >
                    <a
                      class="tecla tecla-sm tecla-peligro"
                      th:href="@{/producto/eliminar/} + ${producto.id}"
                      onclick="return confirm('¿Eliminar este producto? Esta acción no se puede deshacer.');"
                      >Eliminar</a
                    >
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="hoja vacio" th:if="${productos == null or productos.empty}">
        <h2>El catálogo está vacío</h2>
        <p>Crea el primer producto para que los clientes puedan comprarlo.</p>
        <a class="tecla tecla-enter" th:href="@{/producto/agregar}">
          Crear producto
        </a>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
