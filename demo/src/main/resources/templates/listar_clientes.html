<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Clientes')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('clientes')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Clientes</h1>
          <p>Las personas registradas con datos personales en la tienda.</p>
        </div>
      </div>

      <div th:replace="~{fragmentos :: avisos}"></div>

      <div
        class="hoja hoja-tabla"
        th:if="${clientes != null and !clientes.empty}"
      >
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Registro</th>
                <th><span class="visualmente-oculto">Acciones</span></th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="cliente : ${clientes}">
                <td
                  class="fuerte"
                  th:text="${cliente.nombre} + ' ' + ${cliente.apellido}"
                ></td>
                <td th:text="${cliente.email}"></td>
                <td
                  class="tenue"
                  th:text="${#dates.format(cliente.crDate, 'dd/MM/yyyy')}"
                ></td>
                <td>
                  <div class="acciones">
                    <a
                      class="tecla tecla-sm"
                      th:href="@{/cliente/editar/{id}(id=${cliente.id})}"
                      >Editar</a
                    >
                    <a
                      class="tecla tecla-sm tecla-peligro"
                      th:href="@{/cliente/eliminar/{id}(id=${cliente.id})}"
                      onclick="return confirm('¿Eliminar este cliente y su cuenta de acceso? Esta acción no se puede deshacer.');"
                      >Eliminar</a
                    >
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="hoja vacio" th:if="${clientes == null or clientes.empty}">
        <h2>Aún no hay clientes</h2>
        <p>
          Los clientes aparecen aquí cuando completan sus datos personales.
        </p>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
