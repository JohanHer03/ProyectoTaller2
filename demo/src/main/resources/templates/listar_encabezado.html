<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head(${titulo} ?: 'Compras')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('compras')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Compras</h1>
          <p>Todas las compras de los clientes, de la más antigua a la más reciente.</p>
        </div>
      </div>

      <div class="hoja vacio" th:if="${#lists.isEmpty(encabezados)}">
        <h2>Aún no hay compras</h2>
        <p>Las compras que hagan los clientes aparecerán aquí.</p>
      </div>

      <div
        class="hoja hoja-tabla"
        th:if="${!#lists.isEmpty(encabezados)}"
      >
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Compra</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th class="num">Total</th>
                <th><span class="visualmente-oculto">Acciones</span></th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="encabezado : ${encabezados}">
                <td class="fuerte" th:text="'N.º ' + ${encabezado.id}"></td>
                <td
                  th:text="${encabezado.cliente.nombre} + ' ' + ${encabezado.cliente.apellido}"
                ></td>
                <td
                  th:text="${#dates.format(encabezado.fecha, 'dd/MM/yyyy')}"
                ></td>
                <td
                  class="num fuerte"
                  th:text="'$' + ${#numbers.formatDecimal(encabezado.total, 0, 'POINT', 0, 'COMMA')}"
                ></td>
                <td>
                  <div class="acciones">
                    <a
                      class="tecla tecla-sm"
                      th:href="@{/encabezado/detalles/{id}(id=${encabezado.id})}"
                      >Ver detalle</a
                    >
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
