<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Iniciar sesión</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-100 flex items-center justify-center">
    <div class="w-full max-w-md px-6">
      <!-- Tarjeta -->
      <div class="bg-white rounded-2xl shadow-xl p-8">
        <!-- Encabezado -->
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-slate-800">Iniciar sesión</h1>

          <p class="text-slate-500 mt-2">Ingresa a tu cuenta</p>
        </div>

        <!-- Mensaje de error -->
        <div
          th:if="${error}"
          class="mb-6 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-red-700"
        >
          <p th:text="${error}" class="text-sm font-medium"></p>
        </div>

        <!-- Formulario -->
        <form th:action="@{/login/ingresar}" method="post" class="space-y-5">
          <!-- Correo -->
          <div>
            <label
              for="email"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Correo
            </label>

            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="correo@ejemplo.com"
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- Contraseña -->
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-slate-700 mb-2"
            >
              Contraseña
            </label>

            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
            />
          </div>

          <!-- Botón -->
          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition duration-200 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 active:scale-[0.99]"
          >
            Ingresar
          </button>
        </form>

        <!-- Registro -->
        <div class="mt-6 text-center">
          <span class="text-sm text-slate-500"> ¿No tienes una cuenta? </span>

          <a
            th:href="@{/login/registro}"
            class="text-sm font-semibold text-blue-600 hover:text-blue-700 hover:underline"
          >
            Registrarse
          </a>
        </div>
      </div>

      <!-- Texto inferior -->
      <p class="text-center text-xs text-slate-400 mt-6">
        Plataforma de compras
      </p>
    </div>
  </body>
</html>
