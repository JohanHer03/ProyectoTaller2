<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Iniciar sesión')}"></head>

  <body>
    <main class="acceso">
      <div class="acceso-caja">
        <span class="marca">
          <span class="marca-tecla" aria-hidden="true">LP</span>
          LuiPaoxYin
        </span>

        <div class="hoja">
          <h1>Inicia sesión</h1>
          <p class="acceso-nota">Entra con el correo de tu cuenta.</p>

          <div th:replace="~{fragmentos :: avisos}"></div>

          <form th:action="@{/login/ingresar}" method="post" class="formulario">
            <div class="campo">
              <label for="email">Correo</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="correo@ejemplo.com"
              />
            </div>

            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="tecla tecla-enter tecla-ancha">
              Ingresar <span class="leyenda" aria-hidden="true">↵</span>
            </button>
          </form>
        </div>

        <p class="acceso-alterno">
          <a th:href="@{/login/recuperar}">¿Olvidaste tu contraseña?</a>
        </p>

        <p class="acceso-alterno">
          ¿Aún no tienes cuenta?
          <a th:href="@{/login/registro}">Regístrate</a>
        </p>
      </div>
    </main>
  </body>
</html>
