<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head(${titulo} ?: 'Usuarios')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('usuarios')}"></header>

    <main class="pagina">
      <div class="cabecera">
        <div>
          <h1>Usuarios</h1>
          <p>Activa las cuentas pendientes y decide el rol de cada persona.</p>
        </div>

        <div class="acciones">
          <a class="tecla tecla-enter" th:href="@{/admin/crear-cliente}">
            Crear usuario
          </a>
        </div>
      </div>

      <div class="hoja hoja-tabla">
        <div class="tabla-desliza">
          <table class="tabla">
            <thead>
              <tr>
                <th>Correo</th>
                <th>Estado</th>
                <th>Datos personales</th>
                <th>Rol</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="usuario : ${usuarios}">
                <td class="fuerte" th:text="${usuario.email}"></td>

                <td>
                  <span
                    class="estado estado-ok"
                    th:if="${usuario.estado == 'ACTIVO'}"
                    >Activo</span
                  >
                  <span
                    class="estado estado-pendiente"
                    th:if="${usuario.estado == 'PENDIENTE'}"
                    >Pendiente</span
                  >
                </td>

                <td>
                  <span
                    class="estado estado-ok"
                    th:if="${usuario.cliente != null}"
                    >Completos</span
                  >
                  <span
                    class="estado estado-neutro"
                    th:if="${usuario.cliente == null}"
                    >Sin completar</span
                  >
                </td>

                <td>
                  <!-- Pendiente: activar con un rol -->
                  <form
                    th:if="${usuario.estado == 'PENDIENTE'}"
                    th:action="@{/admin/activar}"
                    method="post"
                    class="form-en-linea"
                  >
                    <input type="hidden" name="id" th:value="${usuario.id}" />
                    <select
                      name="rol"
                      th:aria-label="'Rol para ' + ${usuario.email}"
                    >
                      <option value="CLIENTE">Cliente</option>
                      <option value="ADMIN">Administrador</option>
                    </select>
                    <button type="submit" class="tecla tecla-sm tecla-enter">
                      Activar
                    </button>
                  </form>

                  <!-- Superadmin: rol fijo -->
                  <span
                    class="estado estado-rol"
                    th:if="${usuario.esSuperAdmin()}"
                    title="Este rol no se puede cambiar"
                    >Superadministrador</span
                  >

                  <!-- Activo: cambiar rol -->
                  <form
                    th:if="${usuario.estado == 'ACTIVO' and !usuario.esSuperAdmin()}"
                    th:action="@{/admin/modificar-rol}"
                    method="post"
                    class="form-en-linea"
                  >
                    <input type="hidden" name="id" th:value="${usuario.id}" />
                    <select
                      name="rol"
                      th:aria-label="'Rol de ' + ${usuario.email}"
                    >
                      <option
                        value="CLIENTE"
                        th:selected="${usuario.rol == 'CLIENTE'}"
                      >
                        Cliente
                      </option>
                      <option
                        value="ADMIN"
                        th:selected="${usuario.rol == 'ADMIN'}"
                      >
                        Administrador
                      </option>
                    </select>
                    <button type="submit" class="tecla tecla-sm">Guardar</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
