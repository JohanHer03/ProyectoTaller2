<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Mi perfil')}"></head>

  <body>
    <header th:replace="~{fragmentos :: barra('')}"></header>

    <main class="pagina pagina-angosta">
      <div class="cabecera">
        <div>
          <h1 th:text="${cliente.nombre} + ' ' + ${cliente.apellido}">Mi perfil</h1>
          <p>Tus datos como administrador de la tienda.</p>
        </div>
      </div>

      <div class="hoja">
        <dl class="ficha">
          <div>
            <dt>Nombre</dt>
            <dd th:text="${cliente.nombre}"></dd>
          </div>
          <div>
            <dt>Apellido</dt>
            <dd th:text="${cliente.apellido}"></dd>
          </div>
          <div>
            <dt>Correo</dt>
            <dd th:text="${cliente.email}"></dd>
          </div>
          <div>
            <dt>Registrado desde</dt>
            <dd th:text="${#dates.format(cliente.crDate, 'dd/MM/yyyy')}"></dd>
          </div>
        </dl>
      </div>

      <div class="acciones acciones-pie">
        <a class="tecla tecla-enter" th:href="@{/admin/perfil/editar}">
          Editar mis datos
        </a>
        <a class="tecla" th:href="@{/admin/cambiar-password}">
          Cambiar contraseña
        </a>
      </div>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
  </body>
</html>
