<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragmentos :: head('Recuperar contraseña')}"></head>

  <body>
    <main class="acceso">
      <div class="acceso-caja">
        <a class="marca" th:href="@{/login/}">
          <span class="marca-tecla" aria-hidden="true">LP</span>
          LuiPaoxYin
        </a>

        <div class="hoja">
          <h1>Cambia tu contraseña</h1>
          <p class="acceso-nota">
            Elige una contraseña nueva. El administrador revisará la solicitud
            y, cuando la apruebe, podrás entrar con ella.
          </p>

          <div th:replace="~{fragmentos :: avisos}"></div>

          <form th:action="@{/login/recuperar}" method="post" class="formulario">
            <div class="campo">
              <label for="email">Correo de tu cuenta</label>
              <input
                type="email"
                id="email"
                name="email"
                th:value="${email}"
                required
                autocomplete="email"
                placeholder="correo@ejemplo.com"
              />
            </div>

            <div class="campo">
              <label for="nuevaPassword">Nueva contraseña</label>
              <input
                type="password"
                id="nuevaPassword"
                name="nuevaPassword"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo">
              <label for="confirmarPassword">Repite la nueva contraseña</label>
              <input
                type="password"
                id="confirmarPassword"
                name="confirmarPassword"
                required
                autocomplete="new-password"
              />
            </div>

            <button type="submit" class="tecla tecla-enter tecla-ancha">
              Enviar solicitud <span class="leyenda" aria-hidden="true">↵</span>
            </button>
          </form>
        </div>

        <p class="acceso-alterno">
          ¿La recordaste?
          <a th:href="@{/login/}">Inicia sesión</a>
        </p>
      </div>
    </main>
  </body>
</html>
